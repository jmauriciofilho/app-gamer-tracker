name: game_tracker
description: Meu rastreador de jogos pessoal em Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Banco de Dados Local (Suíte da Comunidade)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.2

  # Gerenciamento de Estado
  flutter_riverpod: ^2.5.0

  # Componentes de UI
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  google_fonts: ^6.1.0

  # Seletor de arquivos do sistema (backup local em JSON)
  file_picker: ^13.3.0

  # Cliente HTTP (busca de dados do jogo no Wikidata/Steam)
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Geradores do Isar v4
  build_runner: ^2.4.8
  
  # Gerador da Comunidade 100% Compatível
  isar_community_generator: ^3.3.2

  # Gerador dos ícones do app (dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícone do app gerado a partir de assets/icon (fontes em SVG ao lado dos PNGs)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#381E72"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # O foreground já vem com margem (zona segura), então sem inset extra
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#381E72"
  macos:
    generate: true
